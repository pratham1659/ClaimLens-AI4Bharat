# docker-compose.dev.yml
# Development override for ClaimLens Insurance Platform
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # PostgreSQL Database with pgvector - Development overrides
  db:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: claimlens
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql

  # Redis - No changes needed for development
  redis:
    command: redis-server --appendonly yes

  # Backend API - Development mode with hot-reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimlens-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/claimlens
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-claimlens-prod-documents-ap-south-1}
      - S3_ENDPOINT_URL=http://localstack:4566
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend - Development mode with hot-reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: claimlens-frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # LocalStack for local AWS S3 development
  localstack:
    image: localstack/localstack:latest
    container_name: claimlens-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data_dev:/tmp/localstack
      - ./backend/scripts/init-localstack.sh:/etc/localstack/init/ready.d/init.sh

volumes:
  postgres_data_dev:
  localstack_data_dev:

networks:
  default:
    name: claimlens-network
